<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dusty Combat</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");
    :root {
      --bg: #050200;
      --panel: #100800;
      --ink: #ffb000;
      --ink-dim: #c47a00;
      --glow: #ffbf40;
      --ok: #ffd27a;
      --danger: #ff6a2a;
      --line: #7a4a00;
    }
    * { box-sizing: border-box; }
    html { overflow-y: scroll; scrollbar-color: #c47a00 #090400; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #090400; }
    ::-webkit-scrollbar-thumb { background: #7a4a00; border: 1px solid #ffb000; }
    ::-webkit-scrollbar-thumb:hover { background: #c47a00; }
    ::-webkit-scrollbar-corner { background: #090400; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed; inset: 0;
      background:
        linear-gradient(180deg, rgba(255,180,40,0.05), transparent 12%, transparent 88%, rgba(0,0,0,0.35)),
        radial-gradient(ellipse at center, rgba(255,140,0,0.07), transparent 70%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px);
      background-attachment: fixed;
      z-index: 0;
    }
    header, main, footer.bar { position: relative; z-index: 1; }
    header { padding: 1rem 1rem .35rem; max-width: 42rem; margin: 0 auto; }
    h1 {
      font-size: 1.05rem;
      margin: 0 0 .35rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1::before { content: "> "; }
    p.sub { margin: 0; color: var(--ink-dim); font-size: .85rem; }
    a { color: var(--ink); }
    main { padding: .5rem 1rem 1.5rem; max-width: 42rem; margin: 0 auto; }
    #rosterPad { width: 100%; height: 10rem; flex: none; pointer-events: none; }
    button, .file-btn {
      appearance: none; border: 1px solid var(--ink); border-radius: 0;
      padding: .7rem .95rem; font: inherit; font-weight: 700; letter-spacing: .06em;
      cursor: pointer; background: transparent; color: var(--ink);
      text-transform: uppercase;
    }
    button:hover, .file-btn:hover { background: rgba(255,176,0,.12); }
    button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    .file-btn { display: inline-block; }
    input[type=file] { display: none; }
    .drop {
      border: 1px dashed var(--line); border-radius: 0; padding: 1rem;
      text-align: center; color: var(--ink-dim); margin: .5rem 0;
      background: rgba(16,8,0,.65);
    }
    .drop.over { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 18px rgba(255,176,0,.15); }
    label.field { display: block; margin: .65rem 0; }
    label.field span { display: block; color: var(--ink-dim); font-size: .78rem; margin-bottom: .25rem; letter-spacing: .08em; text-transform: uppercase; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    input[type=text], input[type=number] {
      width: 100%; padding: .65rem .7rem; border-radius: 0;
      border: 1px solid var(--line); background: #090400; color: var(--ink);
      font: inherit; caret-color: var(--glow);
    }
    input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .card {
      background: rgba(16,8,0,.72);
      border: 1px solid var(--line);
      border-radius: 0;
      padding: .9rem;
      margin: .75rem 0;
    }
    .special-title {
      display: block;
      color: var(--ink);
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,176,0,.55);
      margin-bottom: .5rem;
    }
    .status { font-size: .9rem; color: var(--ink-dim); min-height: 1.2rem; }
    .status.err { color: var(--danger); }
    .list { font-size: .9rem; color: var(--ink-dim); margin: .6rem 0 0; text-align: center; }
    .chk {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.6rem; height: 1.6rem; flex: 0 0 1.6rem;
      box-sizing: border-box; margin-right: .35rem;
      border: 1px solid var(--line); background: #090400; color: var(--ink);
      font: inherit; font-weight: 700; padding: 0; cursor: pointer;
      text-transform: none; letter-spacing: 0; line-height: 1;
    }
    .chk::before { content: "X"; visibility: hidden; }
    .chk.on { border-color: var(--ink); }
    .chk.on::before { visibility: visible; }
    .conflict-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .45rem;
      align-items: center;
      padding: .4rem 0;
      border-bottom: 1px solid var(--line);
      font-size: .88rem;
    }
    .conflict-row:last-child { border-bottom: 0; }
    .conflict-row .name { color: var(--ink); }
    .radio {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-dim);
      font: inherit;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: .25rem .45rem;
      cursor: pointer;
    }
    .radio.on { background: var(--ink); color: #140800; border-color: var(--line); }
    .row-btns { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin: .55rem 0; }
    .row-btns button { padding: .45rem .7rem; }
    .fighter {
      --ink: var(--accent, #ffb000);
      --ink-dim: color-mix(in srgb, var(--accent, #ffb000) 62%, #090400);
      --glow: color-mix(in srgb, var(--accent, #ffb000) 45%, #ffffff);
      --line: color-mix(in srgb, var(--accent, #ffb000) 28%, #090400);
      color: var(--ink);
      background: color-mix(in srgb, var(--accent, #ffb000) 2%, #090400);
      border: 1px solid var(--line);
      position: relative;
      padding: .75rem .8rem .65rem;
      margin: 2rem 0 .65rem;
    }
    .fighter input[type=text],
    .fighter input[type=number] {
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
    }
    .fighter.active {
      border-color: var(--ink);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent, #ffb000) 28%, transparent);
    }
    .fighter.amber {
      --ink: #ffb000;
      --ink-dim: #c47a00;
      --glow: #ffbf40;
      --line: #7a4a00;
      background: #0e0700;
    }
    .fighter.amber input[type=text],
    .fighter.amber input[type=number],
    .fighter.amber .fighter-name:focus {
      background: #090400;
    }
    .fighter.amber.active {
      box-shadow: 0 0 14px rgba(255,176,0,.28);
    }
    .fighter ::selection { background: var(--ink); color: #140800; }
    .fighter.down { opacity: .55; }
    body.dragging-roster { cursor: grabbing; user-select: none; }
    .fighter {
      display: grid;
      grid-template-columns: 1.35rem 1fr;
      column-gap: .4rem;
      align-items: stretch;
    }
    .fighter-main { min-width: 0; }
    .fighter button:hover,
    .fighter button:focus-visible {
      background: color-mix(in srgb, var(--ink) 16%, transparent);
    }
    .grip {
      display: grid;
      grid-template-columns: 4px 4px;
      grid-template-rows: 4px 4px 4px;
      gap: 3px;
      align-content: center;
      justify-content: center;
      align-self: stretch;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-dim);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .grip i {
      width: 4px;
      height: 4px;
      background: currentColor;
      pointer-events: none;
    }
    .grip:hover { color: var(--ink); }
    .grip:active, .fighter.dragging .grip { cursor: grabbing; color: var(--ink); }
    .fighter.dragging {
      position: fixed;
      z-index: 30;
      margin: 0;
      pointer-events: none;
      opacity: .96;
      box-shadow: 0 0 18px color-mix(in srgb, var(--accent, #ffb000) 35%, transparent);
    }
    .drop-slot {
      --ink: var(--accent, #ffb000);
      --ink-dim: color-mix(in srgb, var(--accent, #ffb000) 62%, #090400);
      box-sizing: border-box;
      margin: .65rem 0;
      border: 1px dashed var(--ink);
      background: color-mix(in srgb, var(--ink) 8%, transparent);
      color: var(--ink);
      pointer-events: none;
    }
    .drop-slot.amber {
      --ink: #ffb000;
      --ink-dim: #c47a00;
    }
    .drop-slot::after {
      content: "DROP HERE";
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink);
      letter-spacing: .14em;
      font-size: .78rem;
    }
    .fighter-main {
      --hp-bar-width: calc(1.3rem + 9ch + 18px);
      display: flex;
      flex-direction: column;
      gap: .3rem;
      min-width: 0;
    }
    .card-row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: .45rem;
    }
    .copy-hp {
      width: max-content;
      flex: 0 0 auto;
      padding: .42rem .85rem;
      white-space: nowrap;
      letter-spacing: .04em;
      font-size: .95rem;
    }
    .pip-row {
      display: flex;
      align-items: center;
      gap: 2px;
      width: var(--hp-bar-width);
      max-width: 100%;
      min-width: 0;
    }
    .fighter input.fighter-name {
      width: calc(30ch + .9rem);
      max-width: min(30ch + .9rem, calc(100% - 2.6rem));
      height: 2.2rem;
      box-sizing: border-box;
      padding: .35rem .45rem;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
      color: var(--accent, var(--ink));
      font: inherit;
      font-size: 1.02rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .fighter input.fighter-name:focus {
      outline: none;
      border-color: var(--ink);
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
      box-shadow: 0 0 0 1px var(--ink);
    }
    .card-tabs {
      position: absolute;
      top: auto;
      bottom: 100%;
      display: flex;
      gap: 3px;
      z-index: 2;
    }
    .card-tabs.left { left: -1px; }
    .card-tabs.right { right: -1px; }
    .fighter .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 1.7rem;
      padding: 0 .55rem;
      border: 1px solid var(--line);
      border-bottom: 0;
      background: color-mix(in srgb, var(--accent, #ffb000) 2%, #090400);
      color: var(--ink);
      font: inherit;
      font-size: .7rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      line-height: 1;
      box-shadow: none;
    }
    .tab.turn {
      display: none;
      background: var(--ink);
      color: #140800;
      font-weight: 700;
    }
    .fighter.active .tab.turn { display: inline-flex; }
    .fighter.active .tab { border-color: var(--ink); }
    .tab.fold, .tab.kill {
      width: 1.7rem;
      padding: 0;
      cursor: pointer;
    }
    .fighter.amber .tab {
      background: #0e0700;
    }
    .fighter.amber .tab.turn {
      background: #ffb000;
      color: #140800;
    }
    .fighter.collapsed .full-only { display: none !important; }
    .fighter:not(.collapsed) .hp-nudge { display: none; }
    .hp-nudge {
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      flex: 0 0 auto;
      letter-spacing: 0;
    }
    .name-block {
      min-width: 0;
      flex: 0 1 auto;
    }
    .name-with-cm {
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .cm {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 1px;
      flex: 0 0 auto;
      width: 2.2rem;
      height: 2.2rem;
      box-sizing: border-box;
      background: #050200;
      border: 1px solid var(--line);
      padding: 2px;
    }
    .cm i {
      display: block;
      min-width: 0;
      min-height: 0;
      background: transparent;
    }
    .icon-row {
      display: flex;
      gap: .3rem;
      flex: 0 0 auto;
      margin-left: auto;
    }
    .icon-row button {
      width: 2.2rem;
      height: 2.2rem;
      box-sizing: border-box;
      padding: 0;
      letter-spacing: 0;
      font-weight: 700;
    }
    .hp-line {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: .28rem;
      font-size: .82rem;
      color: var(--ink-dim);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .hp-line span { white-space: pre; }
    .hp-switch {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: .12rem;
      margin-left: auto;
      flex: 0 0 auto;
    }
    .hp-switch .radio {
      width: 9ch;
      min-width: 9ch;
      box-sizing: border-box;
      padding: .25rem 1ch;
      font-size: .72rem;
      letter-spacing: 0;
      white-space: nowrap;
      text-align: center;
    }
    .swatches, .spec-wrap { width: 100%; }
    .stepper { display: flex; align-items: center; gap: .25rem; }
    .stepper button {
      width: 1.7rem; height: 1.7rem; padding: 0;
      letter-spacing: 0;
    }
    .stepper input {
      width: 2.6rem;
      text-align: center;
      padding: .25rem .15rem;
    }
    .pips {
      display: flex; flex-wrap: nowrap; gap: 2px;
      align-items: center;
      margin: 0;
      min-height: .7rem;
    }
    .hp-heart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.05rem;
      height: 1.05rem;
      color: #ff3b30;
      font-size: 1.05rem;
      line-height: 1;
      margin-right: .25rem;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .hp-heart.broke {
      font-size: 1.05rem;
      transform: scale(.62);
      transform-origin: center center;
    }
    .hp-nums {
      color: var(--accent, var(--ink));
      letter-spacing: .06em;
      font-size: 1rem;
    }
    .pip {
      border: 0;
      background: transparent;
      color: var(--accent, var(--ink));
      padding: 0;
      cursor: pointer;
      font: inherit;
      font-size: 1.05rem;
      line-height: 1;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 400;
    }
    .pip:hover { color: var(--glow); }
    .swatches { display: flex; flex-wrap: wrap; gap: 5px; margin: .15rem 0 .45rem; }
    .swatch {
      width: 1.15rem; height: 1.15rem; padding: 0; border: 1px solid #140800;
    }
    .swatch.on { outline: 1px solid var(--ink); outline-offset: 1px; }
    .spec-wrap { margin-top: .15rem; }
    .spec-readout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      width: 100%;
      margin: 0;
      padding: .35rem .2rem;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }
    .spec-readout:hover {
      background: color-mix(in srgb, var(--ink) 12%, transparent);
      border-color: var(--line);
    }
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(7, 1.7rem);
      gap: .15rem .2rem;
      justify-items: center;
    }
    .spec-grid span {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.15;
    }
    .spec-grid b {
      color: var(--ink-dim);
      font-weight: 700;
      font-size: .72rem;
      letter-spacing: .06em;
    }
    .spec-grid i {
      font-style: normal;
      color: var(--ink);
      font-size: .95rem;
    }
    .spec-warn {
      width: 1.35rem;
      text-align: center;
      color: #ffb000;
      font-size: .95rem;
      line-height: 1;
    }
    .spec-readout .spec-warn {
      font-size: 1.85rem;
      line-height: 1;
    }
    .spec-readout.over .spec-warn,
    .spec-tally .spec-warn { color: #ffb000; }
    .spec-edit {
      margin-top: .45rem;
      padding-top: .45rem;
      border-top: 1px solid var(--line);
    }
    .fighter .special {
      display: grid;
      grid-template-columns: 7.2rem 1fr 2rem;
      gap: .35rem .6rem;
      align-items: center;
    }
    .fighter .special label {
      color: var(--ink-dim);
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .fighter .special span { text-align: center; color: var(--ink); }
    .fighter input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      margin: 0;
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
      border: 1px solid var(--line);
      outline: none;
    }
    .fighter input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
      border: 1px solid var(--line);
    }
    .fighter input[type=range]::-moz-range-track {
      height: 6px;
      background: color-mix(in srgb, var(--accent, #ffb000) 1%, #050200);
      border: 1px solid var(--line);
    }
    .fighter input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 18px;
      margin-top: -7px;
      background: var(--ink);
      border: 1px solid #140800;
    }
    .fighter input[type=range]::-moz-range-thumb {
      width: 10px;
      height: 18px;
      border-radius: 0;
      background: var(--ink);
      border: 1px solid #140800;
    }
    .fighter.amber input[type=range],
    .fighter.amber input[type=range]::-webkit-slider-runnable-track,
    .fighter.amber input[type=range]::-moz-range-track {
      background: #090400;
    }
    .spec-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      margin-top: .55rem;
    }
    .spec-tally {
      display: flex;
      align-items: center;
      gap: .35rem;
      font-size: 1rem;
    }
    .spec-sum { color: var(--ink); }
    .spec-sum.over { color: #ffb000; }
    .spec-save {
      padding: .4rem .8rem;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    .fighter .spec-save:hover {
      background: color-mix(in srgb, var(--ink) 16%, transparent);
    }
    footer.bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: .45rem 1rem calc(.6rem + env(safe-area-inset-bottom));
      background: #070300;
      border-top: 1px solid var(--line);
      display: flex; flex-direction: column; align-items: center; gap: .35rem;
    }
    footer.bar .foot-row {
      width: 100%;
      max-width: calc(42rem - 2rem);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .35rem;
    }
    footer.bar button {
      width: 100%;
      background: var(--ink);
      color: #140800;
      border: 1px solid var(--line);
      box-shadow: 0 0 12px rgba(255,176,0,.45);
      letter-spacing: .04em;
    }
    footer.bar button.ghost {
      background: transparent;
      color: var(--ink);
      box-shadow: none;
    }
    .hidden { display: none !important; }
    ::selection { background: var(--ink); color: #140800; }
    @media (max-width: 560px) {
      .fighter-main { column-gap: .3rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PONY.SYS // DUSTY COMBAT</h1>
    <p class="sub">HP / TURN ORDER. LOAD AN EXPORT OR ADD FIGHTERS. <a href="https://projectmobius13.github.io/dusty-stamp/">DUSTY STAMP</a></p>
  </header>
  <main>
    <p class="status" id="status">WAITING FOR INPUT.</p>
    <div class="drop" id="drop">Load Dust Town export to pull names + SPECIAL
      <div style="margin-top:.6rem;">
        <label class="file-btn">Upload<input id="file" type="file" accept=".txt,text/plain" multiple></label>
        <button type="button" class="file-btn" id="clear-import">Clear</button>
      </div>
      <p class="list" id="list-import"></p>
    </div>
    <div class="card hidden" id="pickCard">
      <span class="special-title">CHARACTERS IN FILE</span>
      <p class="sub" id="pickSummary"></p>
      <button type="button" class="radio" id="limitBtn">LIMIT CHARACTERS</button>
      <div id="limitPanel" class="hidden">
        <label class="field"><span>Filter by name</span><input id="filter" type="text" placeholder="type to list matches"></label>
        <div class="conflict-row">
          <button type="button" class="radio" id="pickAll">ALL</button>
          <button type="button" class="radio" id="pickNone">NONE</button>
        </div>
        <div id="pickList"></div>
      </div>
      <div class="row-btns">
        <button type="button" id="addSelected">ADD SELECTED TO ROSTER</button>
      </div>
    </div>
